org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# GeckoView version.
#  +      -> latest release (needs Android 8+, i.e. Fire OS 7 / 8). Default, for Fire HD 10 (2021).
#  143.+  -> last line that supports Android 5.0+ (Fire OS 5 / 6).
# The minSdk follows automatically (see app/build.gradle.kts).
geckoviewVersion=+
