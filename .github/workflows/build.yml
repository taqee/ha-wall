name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Optional but recommended: a fixed signing key so updates install over the old APK.
      # Secrets: KEYSTORE_B64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS (default hawall).
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon assembleRelease > build.log 2>&1
          rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then
            { grep -E "^e: |error:|Could not|requires|Dependency|FAILED|What went wrong" build.log | head -30; echo "---- tail ----"; tail -25 build.log; } > err.txt
            msg=$(python3 -c "import sys;print(open('err.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ha-wall-${GITHUB_RUN_NUMBER}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ha-wall-apk
          path: out/*.apk

      - name: Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
