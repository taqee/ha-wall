name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Signing key lives in keystore/ (private repo); only its password is a secret.
      # Without the KEYSTORE_PASSWORD secret the APK is signed with a throwaway debug key.
      - name: Use release keystore
        if: env.KEYSTORE_PASSWORD != ''
        run: echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore/hawall-release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set +e
          gradle --no-daemon assembleRelease > build.log 2>&1
          rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then
            { grep -E "^e: |error:|Could not|requires|Dependency|FAILED|What went wrong" build.log | head -30; echo "---- tail ----"; tail -25 build.log; } > err.txt
            msg=$(python3 -c "import sys;print(open('err.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ha-wall-${GITHUB_RUN_NUMBER}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ha-wall-apk
          path: out/*.apk

      - name: Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
